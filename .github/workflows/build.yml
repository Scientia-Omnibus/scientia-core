name: Build Windows .exe

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4


      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Install PyInstaller
        run: uv pip install pyinstaller


      - name: Build .exe
        run: |
          uv run pyinstaller src/__main__.py \
            --onefile --name scientia-core --console --icon assets/icon.ico \
            --collect-all textual \
            --collect-all markdown_it \
            --collect-all mdit_py_plugins
        working-directory: ${{ github.workspace }}

      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scientia-core-windows
          path: dist/scientia-core.exe
          public: true


      - name: Upload to release
        if: github.event_name == 'release'
        run: |
          gh release upload ${{ github.event.release.tag_name }} "dist/scientia-core.exe#scientia-core-windows-x86_64.exe" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
