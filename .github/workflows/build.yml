name: Build Windows .exe

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build .exe
        run: |
          uv run pyinstaller src/__main__.py --onefile --name scientia-core --console --icon assets/icon.ico
        working-directory: ${{ github.workspace }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scientia-core-windows
          path: dist/scientia-core.exe

      - name: Upload to release
        if: github.event_name == 'release'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { repo, owner } = context.repo;
            const release_id = context.payload.release.id;
            await github.rest.repos.uploadReleaseAsset({
              owner, repo,
              release_id,
              name: 'scientia-core-windows-x86_64.exe',
              data: fs.readFileSync('dist/scientia-core.exe'),
            });
